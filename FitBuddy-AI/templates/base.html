<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/styles.css') }}"
    >
</head>

<body>

    <header class="navbar">
        <div class="container">
            <a href="/" class="brand">FitBuddy</a>

            <nav>
                <a href="/">Home</a>
                <a href="/view-all-users">Users</a>
            </nav>
        </div>
    </header>

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

    <footer class="footer">
        <div class="container">
            <p>FitBuddy - AI Fitness Planner</p>
        </div>
    </footer>

</body>
</html>
