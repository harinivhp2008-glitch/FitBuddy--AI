<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FitBuddy - AI Fitness Plan Generator</title>

    <link rel="stylesheet"
          href="/static/css/style.css">
</head>

<body>

<div class="page">

    <div class="card">

        <div class="brand">

            <div class="logo">
                FB
            </div>

            <div>
                <h1>FitBuddy</h1>
                <p>AI Fitness Plan Generator</p>
            </div>

        </div>


        {% if error %}

        <div class="alert error">
            {{ error }}
        </div>

        {% endif %}


        <form action="/generate-workout"
              method="post">

            <div class="form-group">

                <label for="username">
                    Name
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="user_id">
                    User ID
                </label>

                <input
                    id="user_id"
                    name="user_id"
                    type="text"
                    placeholder="Example: FB001"
                    required
                >

            </div>


            <div class="two-columns">

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        id="age"
                        name="age"
                        type="number"
                        min="13"
                        max="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="weight">
                        Weight (kg)
                    </label>

                    <input
                        id="weight"
                        name="weight"
                        type="number"
                        min="1"
                        max="500"
                        step="0.1"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="goal">
                    Fitness Goal
                </label>

                <select
                    id="goal"
                    name="goal"
                    required
                >

                    <option value="General wellness">
                        General wellness
                    </option>

                    <option value="Muscle gain">
                        Muscle gain
                    </option>

                    <option value="Weight loss">
                        Weight loss
                    </option>

                    <option value="Flexibility">
                        Flexibility
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="intensity">
                    Workout Intensity
                </label>

                <select
                    id="intensity"
                    name="intensity"
                    required
                >

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium" selected>
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Generate 7-Day Plan
            </button>

        </form>


        <div class="footer-links">

            <a href="/view-all-users">
                Admin / View All Users
            </a>

            <a href="/docs">
                API Docs
            </a>

        </div>

    </div>

</div>

</body>
</html>
